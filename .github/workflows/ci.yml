name: CI

on:
  push:
    branches:
      - master
  pull_request:
  # #93: no merge queue is configured yet (branch protection is 404, rulesets
  # are []), so this event never fires today — GitHub only emits merge_group
  # once a branch's protection has "Require merge queue" turned on. The rung
  # is added ahead of that flip, not after: #11's amendment already warned
  # that a required check missing from merge_group means the queue never
  # drains once one exists. See docs/releasing.md, "If master becomes
  # protected", for the decision this trigger is half of — the other half,
  # actually enabling the queue, is a repository setting, not code.
  merge_group:

# Cancel superseded runs on a branch, but never on master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # vibe-check computes `git merge-base` itself rather than trusting
          # `github.event.pull_request.base.sha`, which is the base branch tip at
          # an earlier point and drifts as the base branch moves. That needs
          # history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; `rustup show`
      # materializes it so the pin is what actually runs.
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
      - uses: jdx/mise-action@v2
      # CI invokes the same task interface as the git hooks. Duplicating the
      # cargo invocations here is how CI and `hk` silently drift apart.
      - name: Check
        run: mise run check

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # `convco` is pinned in mise.toml; installing it unpinned here would let
      # CI validate against a different version than the commit-msg hook does.
      - uses: jdx/mise-action@v2
      # `origin/$BASE_REF` is the live base branch, not the
      # `github.event.pull_request.base.sha` tip recorded when the event fired,
      # which drifts as the base branch moves. Two dots, not three: `convco
      # check` documents its argument as `<commit>..<commit>` and rejects a
      # three-dot range outright. The ref travels through the environment so a
      # branch name can never be spliced into the shell. `convco` skips merge
      # commits, so the synthetic `refs/pull/N/merge` head is not checked.
      - name: Check commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: convco check "origin/$BASE_REF..HEAD"
