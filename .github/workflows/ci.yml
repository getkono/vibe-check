name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Cancel superseded runs on a branch, but never on master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # vibe-check computes `git merge-base` itself rather than trusting
          # `github.event.pull_request.base.sha`, which is the base branch tip at
          # an earlier point and drifts as the base branch moves. That needs
          # history, not a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; `rustup show`
      # materializes it so the pin is what actually runs.
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
      - uses: jdx/mise-action@v2
      # CI invokes the same task interface as the git hooks. Duplicating the
      # cargo invocations here is how CI and `hk` silently drift apart.
      - name: Check
        run: mise run check

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # `convco` is pinned in mise.toml; installing it unpinned here would let
      # CI validate against a different version than the commit-msg hook does.
      - uses: jdx/mise-action@v2
      # `origin/$BASE_REF` is the live base branch, not the
      # `github.event.pull_request.base.sha` tip recorded when the event fired,
      # which drifts as the base branch moves. Two dots, not three: `convco
      # check` documents its argument as `<commit>..<commit>` and rejects a
      # three-dot range outright. The ref travels through the environment so a
      # branch name can never be spliced into the shell. `convco` skips merge
      # commits, so the synthetic `refs/pull/N/merge` head is not checked.
      - name: Check commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: convco check "origin/$BASE_REF..HEAD"

  # S5b: prove the digest comparison is not inert.
  #
  # `dist/SHA256SUMS` on THIS BRANCH has one hex character of the linux-musl
  # entry changed, and the action is resolved at this branch so that it reads
  # that file. The job passes when the download is REFUSED.
  #
  # This branch is a test fixture and must never merge. A digest check that is
  # present but never exercised is the ordinary way these turn out to be
  # worthless, and no positive test can detect it.
  tamper:
    name: A tampered digest is refused
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: vibe
        continue-on-error: true
        uses: getkono/vibe-check@test/tamper-the-committed-digest
      - name: The mismatch must be what failed
        run: |
          set -euo pipefail
          if [ "${{ steps.vibe.outcome }}" != "failure" ]; then
            echo "::error::the action succeeded against a tampered digest"
            exit 1
          fi
          echo "refused, as it must be"
