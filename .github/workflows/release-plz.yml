name: Release-plz

# NOTE: steps are written out in full rather than shared via YAML anchors.
# GitHub Actions does not support YAML anchors or aliases (`&name` / `*name`);
# a workflow using them fails to parse and never runs at all.
on:
  push:
    branches:
      - master

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Two rapid pushes to master would otherwise race two release runs.
    # `cancel-in-progress: false` because a release run pushes tags and cuts
    # GitHub releases; cancelling mid-run leaves a partial, non-atomic set and a
    # pushed tag is not cleanly retractable. Queueing is safe and
    # self-correcting: `release-plz release` recomputes what is unreleased at run
    # time, so a queued run releases exactly the remainder.
    # The group is DELIBERATELY DISTINCT from release-plz-pr's
    # `release-plz-${{ github.ref }}`. GitHub keeps at most one running plus one
    # pending entry per group, so sharing a group would serialise the two jobs
    # against each other and let a legitimate sibling be cancelled as a
    # superseded pending entry. Do not tidy the two names into one.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # A release created by the default GITHUB_TOKEN does NOT trigger other
      # workflows, so the binary-build workflow would never fire. A GitHub App
      # token does trigger them. Configure the `RELEASE_PLZ_APP_ID` variable and
      # the `RELEASE_PLZ_APP_PRIVATE_KEY` secret to enable that path; without
      # them this falls back to GITHUB_TOKEN and tags still get created, but
      # nothing downstream reacts to them.
      - name: Generate a GitHub App token
        id: app-token
        if: vars.RELEASE_PLZ_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; `rustup show`
      # materializes it so the pin is what actually runs.
      - name: Install Rust toolchain
        run: rustup show
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate a GitHub App token
        id: app-token
        if: vars.RELEASE_PLZ_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # rust-toolchain.toml pins the channel and components; `rustup show`
      # materializes it so the pin is what actually runs.
      - name: Install Rust toolchain
        run: rustup show
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
