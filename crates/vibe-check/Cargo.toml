[package]
name        = "vibe-check"
description = "Decides which evidence a pull request needs, sources it from the CI you already run, and adjudicates a verdict."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
readme.workspace       = true
keywords.workspace     = true
categories.workspace   = true
# `true` here does NOT mean this crate gets published, and it is the only crate
# in the workspace that says so. release-plz filters the release set on cargo's
# own notion of publishability *before* any of its own configuration applies —
# the trace reads `package vibe-check is publishable: false` — so a workspace
# where every crate is `publish = false` has nothing release-plz will ever tag,
# and it reports "nothing to release" and exits 0. That was the state of this
# repository for its whole life.
#
# What actually withholds the registry push is `release-plz.toml`: `publish =
# false` there means release-plz never runs `cargo publish`, and `git_only =
# true` means it reads versions from git tags rather than asking crates.io — a
# question it must not ask, because the name `vibe-check` there belongs to an
# unrelated crate at a higher version. See docs/releasing.md.
#
# The residual sharp edge, stated rather than hidden: a human typing `cargo
# publish` in this directory is no longer refused by cargo. It would fail on the
# taken name instead, which is a worse error message than the one it replaces.
# #98 owns choosing a publishable name, and closing that reverts this to a
# deliberate `false`.
publish     = true

# Two binaries over one library. `cargo-vibe-check` exists so that
# `cargo vibe-check` works: cargo invokes `cargo-<name>` and passes the
# subcommand name back as argv[1], which the shim strips before delegating.
# Sharing the library is what keeps the local and CI code paths identical by
# construction rather than by discipline.
[[bin]]
name = "vibe-check"
path = "src/main.rs"

[[bin]]
name = "cargo-vibe-check"
path = "src/bin/cargo-vibe-check.rs"

[dependencies]
vibe-check-model = { workspace = true }
vibe-check-host  = { workspace = true }
vibe-check-diff  = { workspace = true }
async-trait        = { workspace = true }
blake3             = { workspace = true }
clap               = { workspace = true }
color-eyre         = { workspace = true }
eyre               = { workspace = true }
# The panic bundle is written as JSON to stdout by `panic.rs`, which is the only
# renderer this crate has and must not be able to fail for want of a dependency.
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
vibe-check-testkit = { workspace = true }

[lints]
workspace = true
