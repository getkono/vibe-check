[package]
name        = "vibe-check-model"
description = "Frozen vocabulary for vibe-check: identifiers, the verdict lattice, evidence, and the bundle schema."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish     = false

# This crate is the one that must be right on day one: changing it is the
# refactor the whole architecture exists to avoid. Its dependency list is
# therefore deliberately tiny and should stay that way. No I/O, no async, no
# git, no HTTP — those live in `vibe-check-host`.
#
# `blake3` is the one addition since that rule was written, and it is here
# rather than a crate up because of what would go wrong otherwise. The digest
# is over `EvidenceBundle`'s wire form and over a named list of paths into it
# (`src/digest.rs`); if the type and the list live in different crates, a field
# can be renamed in one release and the path silently stop matching in the
# next, which narrows the digest without failing anything. Keeping them in one
# crate is what lets a single test read every path on the list against a real
# bundle. `model` is also the only crate both the adjudicator and the replay
# corpus can reach, and the escape ledger needs the same canonical JSON so
# `git notes merge -s cat_sort_uniq` can de-duplicate its lines. `blake3` is
# pure computation: no I/O, no async, and no transitive dependency that has
# any.
[dependencies]
serde      = { workspace = true }
# The one addition this list has earned, and now two callers need it.
# `RequirementId::derive` digests a capability and its canonicalized scope, and
# `digest.rs` computes `verdict_digest` and `bundle_id` over RFC 8785 canonical
# JSON. Both have to live beside the types they name: a requirement identifier computed in one crate and re-read
# in another must be the same string, and the only way to guarantee that is for
# there to be one implementation. Digesting is not I/O — it is a pure function of
# bytes this crate already owns — so it does not breach the no-I/O rule, and
# `vibe-check`'s registry digest already uses the same algorithm, so the
# workspace hashes with one primitive rather than two.
blake3     = { workspace = true }
serde_json = { workspace = true }
smol_str   = { workspace = true }
camino     = { workspace = true }
jiff       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# For the structural guards in `tests/`, which parse this workspace's sources.
syn         = { workspace = true }
proc-macro2 = { workspace = true }

[lints]
workspace = true
