[package]
name        = "vibe-check-model"
description = "Frozen vocabulary for vibe-check: identifiers, the verdict lattice, evidence, and the bundle schema."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish     = false

# This crate is the one that must be right on day one: changing it is the
# refactor the whole architecture exists to avoid. Its dependency list is
# therefore deliberately tiny and should stay that way. No I/O, no async, no
# git, no HTTP — those live in `vibe-check-host`.
[dependencies]
serde      = { workspace = true }
# The one addition this list has earned. `RequirementId::derive` digests a
# capability and its canonicalized scope, and that derivation has to live beside
# the type it names: a requirement identifier computed in one crate and re-read
# in another must be the same string, and the only way to guarantee that is for
# there to be one implementation. Digesting is not I/O — it is a pure function of
# bytes this crate already owns — so it does not breach the no-I/O rule, and
# `vibe-check`'s registry digest already uses the same algorithm, so the
# workspace hashes with one primitive rather than two.
blake3     = { workspace = true }
serde_json = { workspace = true }
smol_str   = { workspace = true }
camino     = { workspace = true }
jiff       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# For the structural guards in `tests/`, which parse this workspace's sources.
syn         = { workspace = true }
proc-macro2 = { workspace = true }

[lints]
workspace = true
