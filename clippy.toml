# Determinism, enforced by the linter rather than by discipline.
#
# The guarantee we are protecting: same diff + same policy => same verdict.
# Each entry below closes one way that guarantee silently breaks. These lints
# are all that enforces it today.
#
# The intended enforcement is the replay-corpus test #21 describes -- historical
# bundles re-adjudicated to identical verdict digests. It does not exist, and it
# is further off than its issue reads: an `EvidenceBundle` carries the output of
# adjudication and none of its inputs, so replaying one re-derives nothing and
# could only catch a canonicalization change. It needs the bundle to grow an
# inputs section first (#45), and `vibe-check replay` to be implemented (#59).
# Until then these lints and the proptests are the whole of it, and this comment
# says so rather than crediting a test that has never run.
#
# Escaping a rule is `#[allow(clippy::disallowed_types)]` with a comment. That
# is deliberately visible in review, and #10 is what makes it visible to
# vibe-check too: it adds `allow-added` to the risk flags we classify, so from
# then on we are held to our own standard. Today nothing classifies it.

disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is unspecified and leaks into bundles and digests; use BTreeMap. If insertion order is ever the meaningful order, add `indexmap` back in the same commit as its first use" },
  { path = "std::collections::HashSet", reason = "iteration order is unspecified and leaks into bundles and digests; use BTreeSet" },
  { path = "std::path::Path", reason = "non-UTF-8 paths must be rejected explicitly, never lossily converted, because a lossy path silently changes crate attribution; use camino::Utf8Path (FFI boundaries may allow this lint)" },
  { path = "std::path::PathBuf", reason = "use camino::Utf8PathBuf; see std::path::Path" },
  { path = "std::time::SystemTime", reason = "banning `now` alone leaves `UNIX_EPOCH.elapsed()` and `duration_since(UNIX_EPOCH)`, which read the same clock without spelling it; decision times arrive as `DecisionTime`, display times through the `clock` module" },
  { path = "std::time::Instant", reason = "same hole as SystemTime: `elapsed` is a clock read. Durations are display-only and excluded from digests; measure inside the `clock` module" },
]

disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "time-dependent decisions (skip `expires`, artifact freshness) must read the head commit's committer date so verdicts replay identically; only the `clock` module may read the wall clock" },
  { path = "std::time::Instant::now", reason = "durations are display-only and excluded from digests; measure inside the `clock` module" },
  { path = "jiff::Timestamp::now", reason = "the wall clock the workspace actually reads; same rule as `SystemTime::now`, and the reason this list exists at all is that `clock` is written against jiff, not std" },
  { path = "jiff::Zoned::now", reason = "reads the wall clock *and* the runner's `TZ`, so it can move a date by a day; decision times are pinned to UTC via `DecisionTime::utc_date`" },
  { path = "jiff::tz::TimeZone::system", reason = "the `TZ` half of `Zoned::now`, reachable in one hop from any timestamp: `committer_date.to_zoned(TimeZone::system()).date()` gives two runners in different zones two different dates for one commit, which is one pull request with two verdicts. Name the zone, or use `DecisionTime::utc_date`" },
  { path = "jiff::tz::TimeZone::try_system", reason = "the fallible spelling of `TimeZone::system`, and the same hazard; banning only the infallible one leaves a one-word bypass" },
  { path = "std::fs::read_dir", reason = "directory order is filesystem-dependent; use camino::Utf8Path::read_dir_utf8 and sort the entries explicitly" },
]
