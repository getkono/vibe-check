[tools]
hk = "1.53.0"
"cargo:convco" = "0.7.1"
actionlint = "1.7.7"
# Lints dist/*.sh, which actionlint structurally cannot see: it reads workflow
# files only, and the action's logic lives in shell so that it is lintable at
# all.
shellcheck = "0.11.0"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.format-check]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint all Rust targets"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Apply safe Clippy fixes"
run = "cargo clippy --workspace --fix --allow-dirty --allow-staged --all-targets --all-features"

[tasks.lint-actions]
description = "Lint GitHub Actions workflows"
# `act` is not reliable enough to gate on, so the workflows are linted
# statically instead. The contract with Actions that we *do* test dynamically is
# the generated matrix JSON, which is snapshot-tested from `vibe-check plan`.
run = [
  # actionlint reads workflow files only. It has no mode for composite action
  # metadata and rejects action.yml outright as a malformed workflow, so the
  # action's own guarantees come from the two commands after it.
  "actionlint",
  "shellcheck --shell=bash dist/*.sh",
  { task = "lint-action-surface" },
]

[tasks.lint-action-surface]
description = "Assert the action's frozen input surface and dist/ self-consistency"
# Three claims action.yml and release-binaries.yml make in prose:
#   1. `inputs:` is exactly config-file and config-inline. A third is a v2.
#   2. release-binaries.yml's `workflows:` still matches release-plz.yml's
#      `name:` — renaming that workflow otherwise silently disables the whole
#      binary chain, with no error anywhere.
#   3. dist/RELEASE and dist/SHA256SUMS agree, when they exist at all. They do
#      not until the first promotion, and the gate has to pass in between.
run = "bash dist/lint-surface.sh"

[tasks.test]
description = "Run all Rust tests"
# Hermetic and network-free by design: this runs on the `hk` pre-push hook and
# must stay fast. Nothing is gated behind a cargo feature: no crate has a
# `[features]` table, and `--all-features` — passed here and by `lint` and
# `lint-fix` — would defeat one anyway. Prefer `#[ignore]` plus a `test-slow`
# task if a split is ever needed. #16 owns that decision, since M3 produces the
# first genuinely slow tests; choosing a feature gate instead means all three
# tasks stop passing `--all-features` in the same commit.
run = "cargo test --workspace --all-targets --all-features"

[tasks.snapshot-accept]
description = "Accept pending insta snapshots"
run = "cargo insta accept --workspace"

[tasks.check]
description = "Run all read-only quality checks"
run = [
  { task = "format-check" },
  { task = "lint" },
  { task = "lint-actions" },
  { task = "test" },
]

[tasks.commit-msg]
description = "Validate one Conventional Commit message"
usage = 'arg "<message_file>" help="Path to the commit message file"'
run = 'convco check --from-stdin < "$usage_message_file"'

[tasks.commits]
description = "Validate outgoing commits"
run = '''
if git rev-parse --verify --quiet origin/master >/dev/null; then
  convco check origin/master..HEAD
else
  convco check HEAD
fi
'''

[tasks.hooks-install]
description = "Install repository-local hk hooks through mise"
run = "hk install --mise"
