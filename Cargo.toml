# vibe-check — a Cargo workspace. The root is a *virtual* manifest: there is no
# root package. Every crate lives under `crates/*` and inherits common metadata
# from `[workspace.package]` and pinned versions from `[workspace.dependencies]`.
#
# The dependency DAG is the load-bearing part of this workspace, not a style
# choice. Arrows point one way only:
#
#     vibe-check-model                      frozen vocabulary, no behaviour
#       ├─ vibe-check-host                  side-effect ports (the only async)
#       └─ …                                (diff, evidence, policy, capability,
#                                             risk, engine — added per milestone)
#     ......................................... link-time only .................
#       vibe-check                          bins + `assembly.rs` registration
#
# `vibe-check-engine` must never gain a dependency on a concrete parser,
# analyzer, capability, probe, forge, or renderer. That prohibition is enforced
# here, by the absence of the dependency, rather than by review.
[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
# Edition 2024 needs 1.85, but the `karet-*` dependencies raise the real floor.
rust-version = "1.92"
license      = "MIT"
repository   = "https://github.com/getkono/vibe-check"
homepage     = "https://github.com/getkono/vibe-check"
authors      = ["Justin Chung"]
readme       = "README.md"
keywords     = ["ci", "code-review", "github-actions", "pull-request"]
categories   = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# --- internal ---------------------------------------------------------------
# Path-only while every crate is `publish = false`. If the workspace is ever
# published these gain `version =` pins; see the publish decision in the plan.
vibe-check-model   = { path = "crates/vibe-check-model" }
vibe-check-host    = { path = "crates/vibe-check-host" }
vibe-check-diff    = { path = "crates/vibe-check-diff" }
vibe-check-testkit = { path = "crates/vibe-check-testkit" }

# --- reused from getkono/karet ----------------------------------------------
# karet is a TUI editor/reviewer; its git and diff layer is headless, pure-Rust,
# and already load-bearing. `range_changes(base, head, merge_base: true)` is the
# pull-request diff primitive, and it forces rename detection on regardless of
# the user's `diff.renames` — deterministic by construction, which is why we
# prefer it to shelling out to `git diff`.
#
# The whole karet workspace publishes at one version, so these move together.
#
# `default-features = false` is load-bearing, not tidiness: `karet-vcs` defaults
# to `["signature"]`, which enables `dep:ssh-key`. We never verify a commit
# signature, and a dependency that parses key material has no business in a
# process that runs untrusted pull-request code. NEVER enable the `view` feature
# on any karet crate either — it pulls ratatui, a terminal UI, into a headless
# process. Both bans are asserted, not just stated here:
# `crates/vibe-check-model/tests/no_key_parser_or_tui_in_the_tree.rs`.
karet-vcs = { version = "0.6.0", default-features = false }
# NOT declared: karet-core, karet-diff, karet-filetype.
#
# This previously carried a second reason — that `karet-vcs` 0.2.2 pinned
# `karet-core` 0.2.2, so naming a newer one would link both semver-incompatible
# copies and make a `Span` from one not a `Span` from the other. A synchronized
# 0.6.0 retires that argument, but the other one stands on its own: we do not
# need the crate. `vibe-check-model` defines its own `Location`, carrying a blob
# hash and an enclosing item path so a location stays resolvable after a
# force-push; karet's coordinates describe a live editor buffer and carry
# neither. Declaring it would buy an unused dependency and a second vocabulary
# for the same idea.
#
# `karet-diff` and `karet-filetype` are pins with no consumer. They return
# with the ChangeSet work, in the same commit as their first use.

# --- foundational -----------------------------------------------------------
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror  = "2.0.19"
# Interned, cheap-to-clone strings. Every domain identifier (CapabilityId,
# RiskFlagId, ParserId, …) is a newtype over this rather than a closed enum, so
# that an unknown id from an old bundle or a newer policy stays *representable*.
# You cannot fail closed on a flag you cannot parse.
smol_str = { version = "0.3.6", features = ["serde"] }
# Calendar dates and timestamps. Used for display and for skip `expires`; note
# that time-dependent *decisions* read the head commit's committer date, never
# the wall clock (see the determinism rules).
jiff = { version = "0.2.35", features = ["serde"] }
# UTF-8-only paths. Non-UTF-8 paths are rejected explicitly rather than being
# lossily converted, because a lossy path silently changes crate attribution.
camino = { version = "1.2.5", features = ["serde1"] }

# --- async / execution ------------------------------------------------------
tokio       = { version = "1.53.1", default-features = false }
async-trait = "0.1.91"

# --- diagnostics ------------------------------------------------------------
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
eyre               = "0.6.12"
color-eyre         = "0.6.5"

# --- schema / digests -------------------------------------------------------
# The bundle JSON Schema is GENERATED from the Rust types and committed, with a
# test asserting the regenerated schema is a superset of the committed one, so
# the schema can never drift from the parser.
schemars = "1.2.2"
blake3   = "1.8.6"

# --- application-only -------------------------------------------------------
clap = { version = "4.6.6", features = ["derive", "env"] }

# --- dev --------------------------------------------------------------------
proptest = "1.11.0"
insta    = { version = "1.48.0", features = ["json", "redactions"] }
tempfile = "3.27.0"

# Workspace-wide lint policy. Libraries inherit this via `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Surface errors through typed errors instead of aborting. The adjudicator in
# particular must never panic: a panic is a non-verdict, and a non-verdict is
# indistinguishable from a pass to anything reading the exit code.
unwrap_used = "warn"
expect_used = "warn"
panic       = "warn"
